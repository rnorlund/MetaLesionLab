[project]
name = "metalesionlab"
version = "0.1.0"
description = "Tippa Lingua: language tests for people and AI, in any language, built on Meta's models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["openai>=1.40", "httpx", "numpy", "pillow", "nltk", "wordfreq", "pronouncing"]

[project.optional-dependencies]
gpu = ["torch", "torchvision", "transformers>=5.15", "accelerate", "safetensors"]
web = ["fastapi>=0.110", "uvicorn[standard]", "python-multipart", "fpdf2>=2.7"]
pptx = ["python-pptx>=1.0"]  # scripts/import_pptx_test.py
dev = ["pytest", "python-pptx>=1.0"]
# Plato's Chair experiment (scripts/plato_*.py): DINOv2 embeddings on a laptop (MPS or CPU), stats, figures
experiments = ["torch", "transformers>=5.15", "scipy", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["metalesionlab", "metalesionlab.web"]

[tool.setuptools.package-data]
"metalesionlab.web" = ["pages/*.html", "static/*/*", "static/*/*/*", "sample_lab/*.json", "data/*.json"]
