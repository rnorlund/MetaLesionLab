[project]
name = "metalesionlab"
version = "0.1.0"
description = "Tip of the Tongue: language tests for people and AI, in any language, built on Meta's models"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["openai>=1.40", "httpx", "numpy", "pillow", "nltk", "wordfreq", "pronouncing"]

[project.optional-dependencies]
gpu = ["torch", "torchvision", "transformers>=5.15", "accelerate", "safetensors"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["metalesionlab"]
